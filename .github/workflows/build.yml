name: Build kernel
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev cpio zip device-tree-compiler python3 python3-pip clang-11 lld-11 llvm-11 gcc-aarch64-linux-gnu
          pip3 install pycryptodome
      - name: Prepare paths used by the script
        run: |
          sudo mkdir -p /mnt/c/Users
          sudo chown -R "$USER" /mnt/c
      - name: Fetch reference boot image
        run: |
          mkdir -p x6815c-port/reference-slot-b
          curl -fL -o x6815c-port/reference-slot-b/boot_b.img "https://github.com/${{ github.repository }}/releases/download/refs/boot_b.img"
      - name: Build
        shell: bash
        env:
          CLANG_PATH: /usr/lib/llvm-11/bin
        run: bash x6815c-port/scripts/build-and-validate.sh 2>&1 | tee build.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: boot-images
          path: |
            x6815c-port/out-x6815c/boot_*.img
            x6815c-port/out-x6815c/Image.gz
          if-no-files-found: warn
