name: Build kernel
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev cpio zip device-tree-compiler python3 python3-pip clang lld llvm gcc-aarch64-linux-gnu
          pip3 install pycryptodome
      - name: Build
        run: bash x6815c-port/scripts/build-and-validate.sh 2>&1 | tee build.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: boot-images
          path: "**/boot_*.img"
          if-no-files-found: warn
